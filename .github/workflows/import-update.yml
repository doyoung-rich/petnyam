name: Import PetNyam update

on:
  push:
    paths:
      - petnyam-update.tar.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared update
        run: |
          tar -xzf petnyam-update.tar.gz
          rm -f .github/workflows/pages.yml
          rm -f petnyam-update.tar.gz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish GitHub Pages version"
          git push
