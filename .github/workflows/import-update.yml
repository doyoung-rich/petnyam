name: Import PetNyam update

on:
  push:
    paths:
      - petnyam-update.tar.gz

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared update
        run: |
          tar -xzf petnyam-update.tar.gz
          rm -f petnyam-update.tar.gz .github/workflows/import-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish GitHub Pages version"
          git push
