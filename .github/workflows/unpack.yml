name: Unpack PetNyam source

on:
  push:
    paths:
      - petnyam-source.tar.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          tar -xzf petnyam-source.tar.gz
          rm -f petnyam-source.tar.gz bootstrap.txt .github/workflows/unpack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import PetNyam source"
          git push
