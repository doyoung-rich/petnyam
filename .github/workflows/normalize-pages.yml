name: Normalize final page addresses
on:
  push:
    branches: [main]
    paths:
      - scripts/normalize-addresses.mjs
      - scripts/verify-addresses.mjs
      - scripts/update-priority-pages.mjs
      - scripts/update-feature-articles.mjs
      - docs/feature-articles.js
      - docs/keyword-articles.js
      - docs/about-petnyam.js
      - docs/operator-story.js
      - docs/operator-story.css
      - scripts/verify-operator-story.mjs
      - docs/images/owner/**
      - docs/treat-cost-calculator.js
      - docs/treat-cost-calculator-view.js
      - docs/treat-cost-calculator.css
      - scripts/verify-content-value.mjs
      - docs/coton-articles.js
      - docs/coton-introduction.js
      - scripts/enhance-search.mjs
      - scripts/verify-search.mjs
      - docs/search-metadata.js
      - docs/editorial.js
      - docs/rescue-home.js
      - docs/pet-age-model.js
      - docs/pet-age-calculator.js
      - docs/pet-age-articles.js
      - docs/pet-age-banner.js
      - docs/pet-age-calculator.css
      - scripts/verify-pet-age.mjs
      - docs/title-strategy.js
      - scripts/apply-title-strategy.mjs
      - scripts/verify-titles.mjs
      - docs/addresses.js
      - docs/priority-content.js
      - docs/food-page-content.js
      - docs/food-page-catalog.js
      - docs/food-discovery-model.js
      - docs/food-discovery-view.js
      - docs/food-discovery.js
      - docs/editorial.css
      - scripts/generate-static-details.mjs
      - scripts/verify-food-discovery.mjs
      - docs/rabbit-food-explanations.js
      - docs/dog-cat-food-explanations.js
      - docs/small-pet-food-explanations.js
      - scripts/update-food-pages.mjs
      - scripts/sync-affiliate-display.mjs
      - site-static/affiliate-settings.json
      - .github/workflows/normalize-pages.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: normalize-final-addresses
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update evidence pages and normalize addresses
        run: |
          node scripts/prepare-github-pages.mjs
          node scripts/verify-github-pages.mjs
          node scripts/verify-addresses.mjs
          node scripts/verify-search.mjs
          node scripts/verify-food-pages.mjs
          node scripts/verify-content-value.mjs
          node scripts/verify-titles.mjs
          node scripts/verify-food-discovery.mjs
          node scripts/verify-rescue-home.mjs
          node scripts/verify-pet-age.mjs
          node scripts/verify-operator-story.mjs
          node scripts/sync-affiliate-display.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs site-static
          if ! git diff --cached --quiet; then
            git commit -m "Normalize canonical URLs, internal links and sitemap"
            git push
          fi
      - name: Request existing branch-based Pages build
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
