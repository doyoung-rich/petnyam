<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">고군산 반려견 여행 전 확인할 세 가지</title><desc id="d">펫냠이 직접 제작한 안내도. 육로 접근, 여객선 탑승 규정, 탐방로 출입 규정은 각각 확인해야 합니다. 실제 지도나 현장 사진이 아닙니다.</desc><rect width="1200" height="630" fill="#eaf5fa"/><text x="80" y="105" fill="#17324a" font-family="sans-serif" font-size="28">PETNYAM · 여행 준비 확인표</text><text x="80" y="185" fill="#17324a" font-family="sans-serif" font-weight="700" font-size="52">고군산군도, 강아지와 함께라면?</text><g font-family="sans-serif" fill="#17324a"><rect x="80" y="240" width="1040" height="84" rx="16" fill="white"/><text x="115" y="295" font-size="32">01  선유도·장자도 육로 접근과 시설별 출입 구분</text><rect x="80" y="342" width="1040" height="84" rx="16" fill="white"/><text x="115" y="397" font-size="32">02  방문일 여객선의 이동장·체중·객실 규정 확인</text><rect x="80" y="444" width="1040" height="84" rx="16" fill="white"/><text x="115" y="499" font-size="32">03  섬잇길 구간별 반려견 출입 허용 별도 확인</text><text x="80" y="585" font-size="23">직접 제작한 안내 이미지 · 실제 지도·방문 사진·동반 허용 확인서가 아닙니다.</text></g></svg>
